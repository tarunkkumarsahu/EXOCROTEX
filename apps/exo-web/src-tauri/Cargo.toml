[package]
name = "exocortex-desktop"
version = "0.7.0"
edition = "2021"
description = "Local-first EXOCORTEX cognitive workspace"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
cognitive-core = { path = "../../../crates/cognitive-core" }
serde = { version = "1", features = ["derive"] }
uuid = { version = "1", features = ["serde"] }

# Desktop AI traffic stays on local loopback. No HTTPS/cloud provider is configured.
reqwest = { version = "0.12", default-features = false, features = ["json"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"
