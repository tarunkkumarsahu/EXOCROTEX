name: Apply visual workspace source bundle

on:
  push:
    branches: [feat/visual-workspace-v04-v05]
    paths: [bootstrap/workspace.part9]
  pull_request:
    branches: [feat/evidence-linked-state-v03]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/visual-workspace-v04-v05
          persist-credentials: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install source and verify backend
        run: |
          cat bootstrap/workspace.part{1,2,3,4,5,6,7,8,9} | base64 --decode | tar -xzf - -C .
          sed -i -e 's/raw\.id/raw.0/g' -e 's/raw\.entity/raw.1/g' -e 's/raw\.attribute/raw.2/g' -e 's/raw\.value/raw.3/g' -e 's/raw\.kind/raw.4/g' -e 's/raw\.status/raw.5/g' -e 's/raw\.created_at/raw.6/g' -e 's/raw\.stale_at/raw.7/g' crates/cognitive-core/src/working_state.rs
          cargo fmt --all
          cargo check --workspace
          cargo clippy --workspace --all-targets -- -D warnings
          cargo test --workspace
      - name: Verify React TypeScript build
        working-directory: apps/exo-web
        run: |
          npm install --no-audit --no-fund
          npm run build
      - name: Commit validated source
        run: |
          rm bootstrap/workspace.part{1,2,3,4,5,6,7,8,9}
          rm .github/workflows/apply-visual-workspace.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: Rust API and React cognitive workspace"
          git push origin HEAD:feat/visual-workspace-v04-v05
