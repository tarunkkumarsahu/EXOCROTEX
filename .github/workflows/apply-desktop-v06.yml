name: Apply V0.6 desktop source

on:
  push:
    branches: ["feat/desktop-v06"]
    paths: ["bootstrap/v06.part5"]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/desktop-v06
          persist-credentials: true
      - name: Extract desktop source and remove bootstrap
        run: |
          cat bootstrap/v06.part{1,2,3,4,5} | base64 --decode | tar -xz -C .
          rm bootstrap/v06.part{1,2,3,4,5}
          cargo fmt --all
      - name: Commit and push desktop feature
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: desktop EXOCORTEX Tauri shell V0.6"
          git push origin HEAD:feat/desktop-v06
