name: Apply V0.6 desktop source
on:
  push:
    branches: ["feat/desktop-v06"]
    paths: ["bootstrap/v06.part3"]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/desktop-v06
          persist-credentials: true
      - name: Extract desktop source and clean bootstrap
        run: |
          cat bootstrap/v06.part{1,2,3} | base64 --decode | tar -xz -C .
          rm bootstrap/v06.part{1,2,3}
          printf '\napps/exo-web/src-tauri/target/\napps/exo-web/src-tauri/gen/\napps/exo-web/src-tauri/icons/\napps/exo-web/src-tauri/Cargo.lock\napps/exo-web/node_modules/\napps/exo-web/dist/\n' >> .gitignore
          printf '\n## Native Windows desktop V0.6\n\nRun `cd apps/exo-web; npm install; npm run desktop` for a desktop dev window or `npm run desktop:build` for an NSIS installer. The installed app uses the existing SQLite DB, no local HTTP server. See [docs/DESKTOP_V06.md](docs/DESKTOP_V06.md).\n' >> README.md
          cargo fmt --all
      - name: Commit and push desktop feature
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: desktop EXOCORTEX Tauri shell V0.6"
          git push origin HEAD:feat/desktop-v06
