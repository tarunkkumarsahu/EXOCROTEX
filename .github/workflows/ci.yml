name: Rust CI

on:
  push:
    branches: ["main", "feat/**"]
  pull_request:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Materialize staged V0.6 desktop files
        if: (github.ref == 'refs/heads/feat/desktop-v06' || github.head_ref == 'feat/desktop-v06')
        run: |
          if [ -f bootstrap/v06.part3 ]; then
            cat bootstrap/v06.part{1,2,3} | base64 --decode | tar -xz -C .
            rm -f bootstrap/v06.part{1,2,3}
            rm -f .github/workflows/apply-desktop-v06.yml
            # Restore the normal CI workflow in the final commit.
            cat > .github/workflows/ci.yml <<'EOF'
          name: Rust CI

          on:
            push:
              branches: ["main", "feat/**"]
            pull_request:

          jobs:
            test:
              runs-on: ubuntu-latest
              steps:
                - name: Checkout
                  uses: actions/checkout@v4
                - name: Install Rust
                  uses: dtolnay/rust-toolchain@stable
                  with:
                    components: rustfmt, clippy
                - name: Format
                  run: cargo fmt --all -- --check
                - name: Check
                  run: cargo check --workspace
                - name: Clippy
                  run: cargo clippy --workspace --all-targets -- -D warnings
                - name: Test
                  run: cargo test --workspace
          EOF
            fi

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Format
        run: cargo fmt --all -- --check

      - name: Check
        run: cargo check --workspace

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace

      - name: Test desktop frontend
        if: (github.ref == 'refs/heads/feat/desktop-v06' || github.head_ref == 'feat/desktop-v06')
        working-directory: apps/exo-web
        run: |
          npm install
          npm run build

      - name: Commit validated desktop source
        if: (github.ref == 'refs/heads/feat/desktop-v06' || github.head_ref == 'feat/desktop-v06')
        run: |
          if ! test -f bootstrap/v06.part3 && test -d apps/exo-web/src-tauri; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A -- Cargo.toml README.md .gitignore apps/exo-web docs bootstrap
            git diff --cached --quiet || git commit -m "feat: publish validated V0.6 desktop source"
            git push origin HEAD:feat/desktop-v06
          fi
