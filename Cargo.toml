[workspace]
members = [
    "crates/cognitive-core",
    "apps/exo-cli",
]
resolver = "2"

[workspace.package]
edition = "2021"
version = "0.3.0"

[workspace.dependencies]
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
rusqlite = { version = "0.32", features = ["bundled"] }
